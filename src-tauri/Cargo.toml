[package]
name = "weft"
version = "0.1.0"
description = "weft — multi-repo / multi-tool session orchestrator"
authors = ["weft"]
edition = "2021"

[lib]
name = "weft"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
# OS-level Escape (issue #160 review R1 #5): computer use's control lease can
# put keyboard focus on the CONTROLLED app, not weft's own WebView, so the
# WebView-only Esc keydown handler never sees it — this plugin's global
# shortcut fires regardless of which app has focus. Registered only while a
# control lease is actually held (see `computer::acquire_control`/
# `clear_control`), not app-wide for the whole process lifetime.
tauri-plugin-global-shortcut = "2.3.2"
user-notify = "0.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
base64 = "0.22"
glob = "0.3"
# 飞书扫码接入:二维码 SVG。svg render 内置、不需 image 特性,故关默认特性省编译。
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tauri-plugin-mcp-bridge = "0.11.2"
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
async-trait = "0.1"
dashmap = "6"
dirs = "5"
futures = "0.3"
# Lock-free concurrent map for the codex consumer's in-flight ask ids (touched by
# the consumer loop AND its spawned per-ask reply tasks) — avoids an async
# Mutex<HashMap> for the serverRequest/resolved → cancel-card mapping.
crossbeam-skiplist = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# proc_registry 用 libc 做 fork-free 的进程组治理(killpg / 进程枚举):逼近 fork 上限时
# shell 外化 ps/kill 本身也要 fork 会失败,故必须走 syscall。已是传递依赖,提为直接依赖零成本。
libc = "0.2"
axum = "0.7"
tower = "0.5"
# opencode slash-command discovery hits http://127.0.0.1（无需 TLS）；飞书 CardKit
# 流式卡片走 HTTPS（open.feishu.cn），故启用 rustls-tls（rustls 已由 openlark 引入，
# 此处仅复用，编译成本已付）。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
toml_edit = "0.22"
roxmltree = "0.20"
keepawake = "0.6"
# Package renamed open-lark -> openlark (0.15+); lib import path stays `open_lark::*`.
openlark = { version = "0.17", default-features = false, features = ["communication", "cardkit", "websocket"] }
tauri-plugin-process = "2"
# SQLCipher: replace SQLite with the encrypted variant statically. The feature
# must be declared on the top-level manifest so it propagates via Cargo feature
# unification to sqlx-sqlite's indirect dep on libsqlite3-sys.
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher-vendored-openssl"] }
# `keyring` ships with NO platform backend enabled by default — on macOS this
# silently no-ops writes and returns NoEntry on reads, which makes the SQLCipher
# key mint a fresh random key every launch and instantly orphans the previous
# encrypted db. Enable `apple-native` (Security framework) here.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
rand = "0.8"
sha1 = "0.10"
hex = "0.4"
fs2 = "0.4"
# Pulled in solely to call `CryptoProvider::install_default` at boot. Several
# of our transitive deps enable both `ring` and `aws-lc-rs`, which makes
# rustls refuse to auto-pick and panics at the first TLS handshake. Pin the
# choice once at startup (lib.rs `run()`).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# main 侧引入:host/automerge 的进程输出捕获用常规文件(tempfile::tempfile)替代
# 管道(见其注释),属生产路径,故归 [dependencies](测试的 tempdir 一并可用)。
tempfile = "3"
# computer/mod.rs 的截图缩放 + PNG 落盘用它;MockBackend 测试路径也吃这个,故是常规
# 依赖(不随 computer-os feature 门控)。xcap 本身也依赖 image,复用编译成本。
# `jpeg`(issue #160 M3-B):`encode_jpeg_data_uri` 把截图编码成 MCP image content /
# Ask 卡预览的 `data:image/jpeg;base64,...`——PNG 对照片级截图偏大,JPEG 在这个
# 用途(有损、丢给模型/人眼看,不是存档)上明显更省 token/带宽。
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# OS 级窗口枚举 + 截图(issue #160 M1)。本机(Linux 容器)编译不过:xcap 传递依赖
# gdk-sys/gtk 等系统库(pkg-config 找不到 gdk-3.0.pc,容器内未装 GTK dev 包),
# `cargo check` 直接 build-script 失败。降级为 optional + `computer-os` feature
# (默认关):有 GUI 系统库的机器(开发者本机/CI 打包机)手动开启即可编译出真实后端,
# 无该 feature 时 `computer::backend()` 返回恒 Unsupported 的 stub,绝不阻塞默认构建。
xcap = { version = "0.9.7", optional = true }
# 鼠标/键盘输入注入(issue #160 M2)。同上 xcap 的容器编译问题:Linux 下走 X11,
# 传递依赖系统库本机同样缺失。同挂 `computer-os` feature(默认关),不影响默认构建。
enigo = { version = "0.6", optional = true }
sha2 = "0.10"
# Session-scoped `/computer/:thread/:dir/mcp` auth token (issue #160 round-11
# P1 #A): HMAC-SHA256(process secret, "{thread}/{dir}"), verified constant-
# time via `Mac::verify_slice`. sha2 is already a dependency (see above); a
# proper HMAC construction (not a hand-rolled sha256(secret||msg)) avoids a
# length-extension footgun for the small cost of this one crate.
hmac = "0.12"

# issue #160 round-18 P1 (Codex inject.rs:500): owner-only ACL for the
# bearer-bearing opencode.json on Windows — see `bus::inject::
# restrict_handle_to_owner`. Windows-only (this whole block is ignored on unix
# targets, so it never touches the Linux/macOS build or CI), and pinned to the
# `0.61` line already resolved transitively (tauri/keyring), so it adds no new
# crate version. Only the handful of Win32 modules the ACL calls need.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

# issue #160 round-18 P2 (Codex os.rs:418): in-process X11 window activation
# (the EWMH `_NET_ACTIVE_WINDOW` client message) so a clean Linux desktop no
# longer needs `wmctrl`/`xdotool` separately installed just to focus a window
# before input — see `computer::os::activate_window_x11`. Optional + only in
# `computer-os` (default off) and Linux-only, so it adds nothing to the default
# build. `x11rb` is already resolved transitively via `xcap`'s own X11 backend,
# so this pins to that same line and pulls no new crate.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", optional = true }

[features]
# 见上面 xcap/enigo 依赖注释。默认关闭,不影响任何现有构建/CI。
# x11rb (Linux 进程内窗口激活)同挂本 feature,仅在 Linux 目标存在,其余平台为空操作。
computer-os = ["dep:xcap", "dep:enigo", "dep:x11rb"]

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
