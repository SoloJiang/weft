[workspace]
resolver = "2"
members = ["crates/app-server", "crates/core", "crates/daemon"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
